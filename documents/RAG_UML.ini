# Diagramme de flux simplifié

UTILISATEUR
    │
    ▼  
┌─────────┐    ┌─────────┐    ┌─────────┐    ┌─────────┐
│QUESTION │──▶│EMBEDDING│───▶│RECHERCHE│──▶│FILTRAGE │
└─────────┘    └─────────┘    └─────────┘    └─────────┘
                                              │
┌─────────┐    ┌─────────┐    ┌─────────┐     │
│RÉPONSE  │◀──│GÉNÉRATION◀───│CONTEXTE │◀───┘
└─────────┘    └─────────┘    └─────────┘


UTILISATEUR: "Quels hôtels à Lyon ont un spa ?"
    ↓
EMBEDDING: Mistral-Embed → vecteur [0.12, -0.45, 0.78, ...]
    ↓
RECHERCHE: FAISS → retrouve 50 documents sur les hôtels lyonnais
    ↓
FILTRAGE: Filtre par "ville: Lyon" + "spa: true" → 12 documents
    ↓
CONTEXTE: Combine les 5 meilleurs documents + prompt template
    ↓
GÉNÉRATION: Mistral-7B → "Voici les hôtels à Lyon avec spa: ..."
    ↓
RÉPONSE: "Hôtel A, Hôtel B et Hôtel C proposent des spas de qualité..."


# Tableau des composants principaux


| Élément           | Rôle principal                      |
| ----------------- | ----------------------------------- |
| **Mistral**       | Embeddings + génération de réponses |
| **LangChain**     | Pipeline complet du RAG             |
| **FAISS**         | Index vectoriel, recherche rapide   |
| **FastAPI**       | Exposition du système via API       |
| **Docker**        | Conteneurisation et déploiement     |
| **OpenAgenda**    | Source des données d’événements     |
| **Text Splitter** | Optimisation des chunks             |
| **Métadonnées**   | Filtrage intelligent                |
| **Uvicorn**       | Serveur qui exécute l’API           |
| **Pytest**        | Validation et tests                 |
| **curl**          | Tests API simples                   |




✅ Liste détaillée des éléments du projet et leur rôle

🔹 1. Mistral (API – embeddings + LLM)

🎯 Rôle :
Fournit le modèle d’embeddings (Mistral Embeddings).
Fournit le LLM utilisé pour générer la réponse finale.

💡 Pourquoi c’est important ?
Les embeddings transforment le texte en vecteurs numériques pour FAISS.
Le LLM utilise le contexte récupéré pour produire une réponse pertinente.


🔹 2. LangChain

🎯 Rôle :
LangChain est la colonne vertébrale du système RAG :
Gestion des loaders (chargement de données)
Gestion du text splitting (chunking)
Gestion des embeddings
Interaction avec la vector database
Construction de la chaîne RAG
Exécution du prompt final

💡 Pourquoi c’est important ?
LangChain simplifie énormément la création d’un pipeline RAG complet.


🔹 3. FAISS (Facebook AI Similarity Search)

🎯 Rôle :
Base vectorielle pour stocker les embeddings.
Recherche rapide de documents similaires (similarity search).

💡 Pourquoi c’est important ?
FAISS permet d’obtenir en quelques millisecondes les documents les plus pertinents.


🔹 4. FastAPI

🎯 Rôle :
Framework backend utilisé pour exposer le système RAG sous forme d’API.
Création des endpoints /ask, /rebuild, /health.

💡 Pourquoi c’est important ?
Il permet à ton système d’être utilisé par ton front-end, Postman, curl, ou toute autre application externe.


🔹 5. Pydantic

🎯 Rôle :
Valide les requêtes et réponses API.
Définit des modèles comme AskRequest.

💡 Pourquoi c’est important ?
Assure des entrées propres et sécurisées dans le système.


🔹 6. Uvicorn

🎯 Rôle :
Serveur ASGI sur lequel tourne FastAPI.
Commande :
uvicorn app:app --reload

💡 Pourquoi c’est important ?
C’est le serveur qui exécute réellement ton application.


🔹 7. Docker + Dockerfile

🎯 Rôle :
Containerise ton système pour l’exécuter partout.
Le Dockerfile installe Python, copie ton code, installe les dépendances, lance Uvicorn.

💡 Pourquoi c’est important ?
Assure un environnement reproductible et déployable sur n’importe quel serveur.


🔹 8. API OpenAgenda (source de données)

🎯 Rôle :
Fournit les événements culturels (bruts).
Tes scripts récupèrent :
titre
description
dates
ville
catégories

💡 Pourquoi c’est important ?
C’est la source sur laquelle ton système RAG construit sa base de connaissances.


🔹 9. Text Splitter : RecursiveCharacterTextSplitter

🎯 Rôle :
Découpe les descriptions d’événements en chunks de 500 caractères.
Gère les séparateurs intelligents (. ? ! etc.).

💡 Pourquoi c’est important ?
Les modèles de langage ne peuvent pas traiter des textes trop longs.
Le chunking permet d’améliorer la pertinence de la recherche.


🔹 10. Scripts de preprocessing

🎯 Rôle :
Nettoyage des données brutes
Réécriture de certaines descriptions
Gestion des dates
Enrichissement des métadonnées (ville, tags)

💡 Pourquoi c’est important ?
La qualité des embeddings dépend de la qualité du texte source.


🔹 11. Système de métadonnées

🎯 Rôle :
Chaque chunk possède des métadonnées dans FAISS :
ville
date de début
ID de l’événement
catégorie
source

💡 Pourquoi c’est important ?
Permet le filtrage avancé (par ville, date, type d’événement).


🔹 12. Filter_results()

🎯 Rôle :
Filtre les résultats de FAISS selon :
la ville demandée
la date
la période
d’autres contraintes

💡 Pourquoi c’est important ?
Améliore la précision métier avant d’envoyer le contexte au LLM.


🔹 13. Fonctions de parsing

🎯 Rôle :
Extraire la ville de la question utilisateur
Extraire la date ou une période (ex : "ce week-end", "en février")

💡 Pourquoi c’est important ?
Le RAG devient réellement spécialisé dans les événements culturels.


🔹 14. Base JSON des métadonnées

🎯 Rôle :
Fichier stockant les métadonnées et les liens entre chunk ↔ événement original.

💡 Pourquoi c’est important ?
Permet de retrouver les informations d’un événement après recherche dans FAISS.


🔹 15. Tests Pytest

🎯 Rôle :
Vérifier :
que l’API répond
que la recherche fonctionne
que les erreurs sont gérées

💡 Pourquoi c’est important ?
Indispensable pour valider le POC.


🔹 16. curl

🎯 Rôle :
Tester l’API en ligne de commande.

Exemple :
curl -X POST http://localhost:8000/ask -d '{"question": "..."}'

💡 Pourquoi c’est important ?
Très utilisé en démonstration pour montrer le fonctionnement live.