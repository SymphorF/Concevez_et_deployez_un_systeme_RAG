name: API RAG

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # Libérer de l'espace avant l'installation
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo docker volume prune -f || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Installer Poetry 
      - name: Install Poetry
        run: |
          pip install poetry

      # Configurer poetry
      - name: Configure Poetry
        run: |
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: |
          poetry install --no-root

      - name: Set environment variables
        run: |
          echo "MISTRAL_API_KEY=test_key" >> $GITHUB_ENV
          echo "OPENAGENDA_API_KEY=test_key" >> $GITHUB_ENV

      - name: Run tests
        run: |
          cd scripts
          poetry run pytest ../tests/ -v -W ignore::DeprecationWarning

      - name: Test API startup
        run: |
          cd scripts
          poetry run uvicorn rag_fast_api:app --host 0.0.0.0 --port 8000 &
          API_PID=$!
          sleep 15
          curl -f http://localhost:8000/ || exit 1
          kill $API_PID

      - name: Test search endpoint
        run: |
          cd scripts
          poetry run uvicorn rag_fast_api:app --host 0.0.0.0 --port 8000 &
          API_PID=$!
          sleep 15
          curl -f "http://localhost:8000/search?query=concert&k=1" || exit 1
          kill $API_PID
